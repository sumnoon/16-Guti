<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rooftop GLB inspection</title>
<style>*{box-sizing:border-box}body{margin:0;background:#16213e;color:#eee;font:14px system-ui;display:grid;grid-template-columns:290px 1fr;height:100vh}aside{padding:22px;overflow:auto;background:#10192f}h1{font:27px Georgia}select,button{width:100%;padding:10px;margin:8px 0;background:#27324c;color:#fff;border:1px solid #5b4a8a}a{color:#ffb84d}p{line-height:1.5}#stage{min-width:0;position:relative}canvas{display:block;width:100%;height:100%}#error{color:#ffa086;white-space:pre-wrap}small{color:#bdb6c9}@media(max-width:650px){body{grid-template-columns:1fr;grid-template-rows:auto 65vh}aside{max-height:35vh}}</style>
<script type="importmap">{"imports":{"three":"../game/vendor/three/build/three.module.min.js","three/addons/":"../game/vendor/three/examples/jsm/"}}</script></head><body>
<aside><a href="rooftop_index.html">← Asset library</a><h1>Rooftop models</h1><p>Drag to orbit, scroll to zoom.</p><label for="asset">Asset</label><select id="asset"></select><label><input id="wire" type="checkbox"> Wireframe</label><button id="reset">Reset view</button><p id="stats"></p><small>Procedural meshes. Metres, Y-up, bottom-centred local origins. Flower pots and kite flyers are separate named objects.</small><p id="error"></p></aside><div id="stage"></div>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;document.querySelector('#stage').append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#5e6574');const camera=new THREE.PerspectiveCamera(40,1,.001,1000);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xdce8ff,0x685343,1.2));const key=new THREE.DirectionalLight(0xffe4c3,2);key.position.set(4,6,5);scene.add(key);const fill=new THREE.DirectionalLight(0xbfd3ff,.8);fill.position.set(-4,2,-3);scene.add(fill);
// A small procedural studio environment supports glass transmission and metal reflections.
const studio=new THREE.Scene();studio.background=new THREE.Color(.65,.70,.8);for(const [x,y,z] of [[3,4,2],[-3,1,-2]]){const panel=new THREE.Mesh(new THREE.PlaneGeometry(4,5),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide}));panel.position.set(x,y,z);panel.lookAt(0,0,0);studio.add(panel)}const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(studio,0).texture;
const manifest=await (await fetch('rooftop_manifest.json')).json();const assets=manifest.assets.filter(a=>a.type==='models');const select=document.querySelector('#asset');for(const a of assets){const option=document.createElement('option');option.value=a.name;option.textContent=a.name;select.append(option)}
let model,current,serial=0;function frame(){if(!model)return;const box=new THREE.Box3().setFromObject(model),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),r=Math.max(...size.toArray());camera.near=r/1000;camera.far=r*100;camera.position.copy(center).add(new THREE.Vector3(1.35,.85,1.6).multiplyScalar(r));camera.updateProjectionMatrix();controls.target.copy(center);controls.update()}
function release(obj){obj.traverse(o=>{o.geometry?.dispose();for(const m of (Array.isArray(o.material)?o.material:[o.material]).filter(Boolean)){for(const v of Object.values(m))if(v?.isTexture)v.dispose();m.dispose()}})}
async function load(){const id=++serial;current=assets.find(a=>a.name===select.value);document.querySelector('#error').textContent='';try{const gltf=await new GLTFLoader().loadAsync(current.file);if(id!==serial){release(gltf.scene);return}if(model){scene.remove(model);release(model)}model=gltf.scene;scene.add(model);document.querySelector('#stats').textContent=`${current.triangles.toLocaleString()} triangles / ${current.budget.toLocaleString()} budget`;document.querySelector('#wire').checked=false;frame();window.rooftopLoaded=select.value}catch(e){document.querySelector('#error').textContent=e.message;console.error(e)}}
select.onchange=load;document.querySelector('#reset').onclick=frame;document.querySelector('#wire').onchange=e=>model?.traverse(o=>{for(const m of (Array.isArray(o.material)?o.material:[o.material]).filter(Boolean))m.wireframe=e.target.checked});const wanted=new URLSearchParams(location.search).get('asset');if(assets.some(a=>a.name===wanted))select.value=wanted;await load();
new ResizeObserver(()=>{const el=document.querySelector('#stage');renderer.setSize(el.clientWidth,el.clientHeight);camera.aspect=el.clientWidth/el.clientHeight;camera.updateProjectionMatrix()}).observe(document.querySelector('#stage'));renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
